name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Run the smoke and host tests
        run: |
          node test/smoke.mjs
          WIDTH=1400 node test/smoke.mjs
          node test/host.mjs
      - name: Pack the DSH bundle
        run: npm pack
      - name: Publish the tarball to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tgz=$(ls ./*.tgz | head -n1)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$tgz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" "$tgz"
          fi
          want=$(basename "$tgz")
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | while read -r name; do
            if [ "$name" != "$want" ]; then
              gh release delete-asset "$GITHUB_REF_NAME" "$name" -y
            fi
          done
